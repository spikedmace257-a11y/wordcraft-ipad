name: Deploy WordCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download WordCraft
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip \
            -o wordcraft.zip

          unzip -q wordcraft.zip -d extracted

          SITE=$(find extracted -name index.html -print -quit)
          test -n "$SITE"

          SITE=$(dirname "$SITE")

          mkdir -p public
          cp -a "$SITE"/. public/

          touch public/.nojekyll

      - name: Create WASM Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import hashlib

          root = Path("public")
          wasm_files = list(root.rglob("*.wasm"))

          if not wasm_files:
              raise SystemExit("WASM file not found")

          wasm = max(
              wasm_files,
              key=lambda p: p.stat().st_size
          )

          wasm_path = wasm.relative_to(root).as_posix()
          wasm_size = wasm.stat().st_size

          sha256 = hashlib.sha256(
              wasm.read_bytes()
          ).hexdigest()

          print("WASM:", wasm_path)
          print("Size:", wasm_size)
          print("SHA-256:", sha256)

          html = r'''<!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1">

          <title>WordCraft WASM Diagnostics</title>

          <style>
          body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #222;
          }

          h1 {
            font-size: 24px;
          }

          button {
            padding: 13px 17px;
            font-size: 15px;
            background: #405bd4;
            color: white;
            border: 0;
            border-radius: 8px;
            margin: 5px 5px 5px 0;
          }

          button:disabled {
            opacity: .5;
          }

          pre {
            background: white;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
            line-height: 1.5;
          }

          progress {
            width: 100%;
            height: 24px;
          }

          #status {
            font-weight: 600;
          }
          </style>
          </head>

          <body>

          <h1>WordCraft WASM Diagnostics</h1>

          <p>
          Возобновляемая загрузка WebAssembly
          с сохранением в IndexedDB.
          </p>

          <button id="start">
          Начать / продолжить
          </button>

          <button id="stop">
          Остановить
          </button>

          <button id="clear">
          Очистить сохранённые блоки
          </button>

          <button id="copy">
          Скопировать отчёт
          </button>

          <progress id="progress"
                    value="0"
                    max="100"></progress>

          <p id="status">Подготовка...</p>

          <pre id="log"></pre>

          <script>
          const WASM_FILE = __WASM_PATH__;
          const EXPECTED_SIZE = __WASM_SIZE__;
          const EXPECTED_HASH = __WASM_HASH__;

          const CHUNK_SIZE = 512 * 1024;
          const MAX_RETRIES = 5;
          const REQUEST_TIMEOUT = 90000;

          const DB_NAME =
            "wordcraft-wasm-cache-v2";

          const STORE_NAME = "chunks";

          const FILE_KEY =
            WASM_FILE + ":" + EXPECTED_HASH;

          const logElement =
            document.getElementById("log");

          const progress =
            document.getElementById("progress");

          const status =
            document.getElementById("status");

          const startButton =
            document.getElementById("start");

          const stopButton =
            document.getElementById("stop");

          const clearButton =
            document.getElementById("clear");

          let running = false;
          let stopRequested = false;
          let activeController = null;

          function log(message) {
            logElement.textContent +=
              message + "\n";

            console.log(message);
          }

          function formatError(error) {
            return error?.message ||
                   String(error);
          }

          function sleep(ms) {
            return new Promise(resolve =>
              setTimeout(resolve, ms)
            );
          }

          function openDatabase() {
            return new Promise(
              (resolve, reject) => {

                const request =
                  indexedDB.open(DB_NAME, 1);

                request.onupgradeneeded = () => {
                  const db = request.result;

                  if (
                    !db.objectStoreNames.contains(
                      STORE_NAME
                    )
                  ) {
                    db.createObjectStore(
                      STORE_NAME
                    );
                  }
                };

                request.onsuccess = () =>
                  resolve(request.result);

                request.onerror = () =>
                  reject(request.error);
              }
            );
          }

          async function databaseOperation(
            mode,
            operation
          ) {
            const db = await openDatabase();

            try {
              return await new Promise(
                (resolve, reject) => {

                  const tx = db.transaction(
                    STORE_NAME,
                    mode
                  );

                  const store =
                    tx.objectStore(STORE_NAME);

                  let result;

                  const request =
                    operation(store);

                  if (request) {
                    request.onsuccess = () => {
                      result = request.result;
                    };

                    request.onerror = () => {
                      reject(request.error);
                    };
                  }

                  tx.oncomplete = () =>
                    resolve(result);

                  tx.onerror = () =>
                    reject(tx.error);

                  tx.onabort = () =>
                    reject(tx.error);
                }
              );
            } finally {
              db.close();
            }
          }

          function chunkKey(index) {
            return FILE_KEY + ":" + index;
          }

          async function getChunk(index) {
            return databaseOperation(
              "readonly",
              store => store.get(
                chunkKey(index)
              )
            );
          }

          async function saveChunk(
            index,
            bytes
          ) {
            return databaseOperation(
              "readwrite",
              store => store.put(
                bytes,
                chunkKey(index)
              )
            );
          }

          async function clearChunks() {
            return databaseOperation(
              "readwrite",
              store => store.clear()
            );
          }

          async function fetchChunk(
            start,
            end
          ) {
            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              if (stopRequested) {
                throw new Error(
                  "Остановлено пользователем"
                );
              }

              const controller =
                new AbortController();

              activeController = controller;

              const timer = setTimeout(
                () => controller.abort(),
                REQUEST_TIMEOUT
              );

              try {

                const response = await fetch(
                  WASM_FILE,
                  {
                    cache: "no-store",
                    headers: {
                      Range:
                        `bytes=${start}-${end}`
                    },
                    signal: controller.signal
                  }
                );

                if (response.status !== 206) {
                  throw new Error(
                    "Expected HTTP 206, got " +
                    response.status
                  );
                }

                const expectedRange =
                  `bytes ${start}-${end}/${EXPECTED_SIZE}`;

                const range =
                  response.headers.get(
                    "Content-Range"
                  );

                if (range !== expectedRange) {
                  throw new Error(
                    "Unexpected Content-Range: " +
                    range
                  );
                }

                const encoding =
                  response.headers.get(
                    "Content-Encoding"
                  );

                if (
                  encoding &&
                  encoding !== "identity"
                ) {
                  throw new Error(
                    "Unexpected range encoding: " +
                    encoding
                  );
                }

                const buffer =
                  await response.arrayBuffer();

                if (
                  buffer.byteLength !==
                  end - start + 1
                ) {
                  throw new Error(
                    "Invalid chunk length"
                  );
                }

                return new Uint8Array(buffer);

              } catch (error) {

                if (stopRequested) {
                  throw new Error(
                    "Остановлено пользователем"
                  );
                }

                log(
                  "Ошибка блока " +
                  start + "-" + end +
                  ", попытка " +
                  attempt + ": " +
                  formatError(error)
                );

                if (attempt === MAX_RETRIES) {
                  throw error;
                }

                await sleep(
                  Math.min(
                    20000,
                    2000 * attempt
                  )
                );

              } finally {
                clearTimeout(timer);

                if (
                  activeController === controller
                ) {
                  activeController = null;
                }
              }
            }
          }

          function updateProgress(bytes) {
            const percent =
              bytes / EXPECTED_SIZE * 100;

            progress.value = percent;

            status.textContent =
              "Сохранено: " +
              percent.toFixed(1) + "%";
          }

          async function sha256Hex(bytes) {
            const digest =
              await crypto.subtle.digest(
                "SHA-256",
                bytes
              );

            return Array.from(
              new Uint8Array(digest)
            ).map(
              b => b.toString(16)
                    .padStart(2, "0")
            ).join("");
          }

          async function diagnose() {

            if (running) return;

            running = true;
            stopRequested = false;

            startButton.disabled = true;
            clearButton.disabled = true;

            logElement.textContent = "";

            try {

              log("WORDCRAFT WASM DIAGNOSTICS");
              log("==========================");

              log("User Agent:");
              log(navigator.userAgent);

              log("");
              log("WASM: " + WASM_FILE);
              log(
                "Expected size: " +
                EXPECTED_SIZE
              );

              log(
                "Expected SHA-256: " +
                EXPECTED_HASH
              );

              log("");
              log("=== INDEXEDDB ===");

              const totalChunks =
                Math.ceil(
                  EXPECTED_SIZE / CHUNK_SIZE
                );

              let savedBytes = 0;

              for (
                let i = 0;
                i < totalChunks;
                i++
              ) {

                const start =
                  i * CHUNK_SIZE;

                const end = Math.min(
                  start + CHUNK_SIZE,
                  EXPECTED_SIZE
                );

                const chunk =
                  await getChunk(i);

                if (
                  chunk &&
                  chunk.byteLength ===
                  end - start
                ) {
                  savedBytes +=
                    chunk.byteLength;
                }
              }

              log(
                "Previously saved: " +
                savedBytes + " bytes"
              );

              updateProgress(savedBytes);

              log("");
              log("=== CHUNK DOWNLOAD ===");

              for (
                let i = 0;
                i < totalChunks;
                i++
              ) {

                if (stopRequested) {
                  throw new Error(
                    "Остановлено пользователем"
                  );
                }

                const start =
                  i * CHUNK_SIZE;

                const end = Math.min(
                  start + CHUNK_SIZE,
                  EXPECTED_SIZE
                );

                const existing =
                  await getChunk(i);

                if (
                  existing &&
                  existing.byteLength ===
                  end - start
                ) {
                  continue;
                }

                const bytes =
                  await fetchChunk(
                    start,
                    end - 1
                  );

                await saveChunk(
                  i,
                  bytes
                );

                savedBytes +=
                  bytes.byteLength;

                updateProgress(savedBytes);

                log(
                  "OK: блок " +
                  (i + 1) +
                  "/" +
                  totalChunks +
                  " (" +
                  savedBytes +
                  "/" +
                  EXPECTED_SIZE +
                  ")"
                );
              }

              log("");
              log("=== ASSEMBLY ===");

              status.textContent =
                "Сборка WASM";

              const wasmBytes =
                new Uint8Array(
                  EXPECTED_SIZE
                );

              let position = 0;

              for (
                let i = 0;
                i < totalChunks;
                i++
              ) {

                const chunk =
                  await getChunk(i);

                if (!chunk) {
                  throw new Error(
                    "Missing chunk " + i
                  );
                }

                wasmBytes.set(
                  chunk,
                  position
                );

                position +=
                  chunk.byteLength;
              }

              if (
                position !== EXPECTED_SIZE
              ) {
                throw new Error(
                  "Size mismatch"
                );
              }

              log(
                "Assembled: " +
                position + " bytes"
              );

              log("");
              log("=== SHA-256 ===");

              status.textContent =
                "Проверка SHA-256";

              const actualHash =
                await sha256Hex(
                  wasmBytes
                );

              log(
                "Actual SHA-256: " +
                actualHash
              );

              if (
                actualHash !== EXPECTED_HASH
              ) {
                throw new Error(
                  "SHA-256 mismatch"
                );
              }

              log("SHA-256: SUCCESS");

              log("");
              log("=== COMPILE TEST ===");

              status.textContent =
                "Компиляция WebAssembly";

              const module =
                await WebAssembly.compile(
                  wasmBytes
                );

              log(
                "Compilation: SUCCESS"
              );

              log(
                "Imports: " +
                WebAssembly.Module
                  .imports(module).length
              );

              log(
                "Exports: " +
                WebAssembly.Module
                  .exports(module).length
              );

              log("");
              log("DIAGNOSTICS COMPLETED");

              status.textContent =
                "Проверка завершена успешно";

            } catch (error) {

              log("");
              log("=== ERROR ===");

              log(formatError(error));

              status.textContent =
                "Остановлено или ошибка";

            } finally {

              running = false;

              startButton.disabled = false;
              clearButton.disabled = false;
            }
          }

          startButton.onclick = diagnose;

          stopButton.onclick = () => {
            stopRequested = true;

            if (activeController) {
              activeController.abort();
            }

            status.textContent =
              "Остановка...";
          };

          clearButton.onclick = async () => {

            if (running) return;

            if (!confirm(
              "Удалить все сохранённые блоки?"
            )) {
              return;
            }

            try {
              await clearChunks();

              progress.value = 0;

              status.textContent =
                "Сохранённые блоки удалены";

              log("IndexedDB cleared");
            } catch (error) {
              log(
                "Ошибка очистки: " +
                formatError(error)
              );
            }
          };

          document.getElementById(
            "copy"
          ).onclick = async () => {

            try {
              await navigator.clipboard.writeText(
                logElement.textContent
              );

              alert("Отчёт скопирован");
            } catch (error) {
              alert(
                "Не удалось скопировать отчёт"
              );
            }
          };

          async function initialize() {
            try {
              const totalChunks =
                Math.ceil(
                  EXPECTED_SIZE / CHUNK_SIZE
                );

              let savedBytes = 0;

              for (
                let i = 0;
                i < totalChunks;
                i++
              ) {
                const start =
                  i * CHUNK_SIZE;

                const expectedLength =
                  Math.min(
                    CHUNK_SIZE,
                    EXPECTED_SIZE - start
                  );

                const chunk =
                  await getChunk(i);

                if (
                  chunk &&
                  chunk.byteLength ===
                  expectedLength
                ) {
                  savedBytes +=
                    chunk.byteLength;
                }
              }

              updateProgress(savedBytes);

              log(
                "Сохранено ранее: " +
                savedBytes + " байт"
              );

            } catch (error) {
              log(
                "IndexedDB error: " +
                formatError(error)
              );
            }
          }

          initialize();
          </script>

          </body>
          </html>
          '''

          html = html.replace(
              "__WASM_PATH__",
              json.dumps("./" + wasm_path)
          )

          html = html.replace(
              "__WASM_SIZE__",
              str(wasm_size)
          )

          html = html.replace(
              "__WASM_HASH__",
              json.dumps(sha256)
          )

          (root / "diagnostics.html").write_text(
              html,
              encoding="utf-8"
          )

          print("Diagnostics created")

          PY

      - name: Verify Deployment
        shell: bash
        run: |
          set -euo pipefail

          test -f public/index.html
          test -f public/diagnostics.html

          find public -name "*.wasm" -print

          echo "Deployment files verified"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
