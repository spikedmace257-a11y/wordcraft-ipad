name: Deploy WordCraft

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download WordCraft
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading WordCraft v0.18.1..."

          curl -fL --retry 3 \
            https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip \
            -o wordcraft.zip

          mkdir -p extracted

          unzip -q wordcraft.zip -d extracted

          SITE=$(find extracted -name index.html -print -quit)

          if [ -z "$SITE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          SITE=$(dirname "$SITE")

          mkdir -p public

          cp -a "$SITE"/. public/

          touch public/.nojekyll

          echo "WordCraft downloaded successfully."

      - name: Inspect WordCraft Loader
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================="
          echo "WORDCRAFT LOADER INSPECTION"
          echo "=================================="

          echo ""
          echo "=== FILE STRUCTURE ==="

          find public -maxdepth 2 -type f \
            | head -60 || true

          echo ""
          echo "=== INDEX.HTML ==="

          sed -n '1,180p' public/index.html

          echo ""
          echo "=== JAVASCRIPT FILES ==="

          find public -type f \
            \( -name "*.js" -o -name "*.mjs" \) \
            -print

          echo ""
          echo "=== WASM FILES ==="

          find public -name "*.wasm" \
            -exec ls -lh {} \;

          echo ""
          echo "=== WASM INITIALIZATION ==="

          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              r"instantiateStreaming",
              r"WebAssembly\.instantiate",
              r"WebAssembly\.compile",
              r"fetch\(",
              r"\.wasm",
              r"__wbg_init",
              r"initSync",
          ]

          regex = re.compile("|".join(patterns))

          extensions = {".js", ".mjs", ".html"}

          matches = 0

          for path in Path("public").rglob("*"):
              if path.suffix not in extensions:
                  continue

              try:
                  content = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except Exception:
                  continue

              for match in regex.finditer(content):
                  start = max(0, match.start() - 150)
                  end = min(len(content), match.end() + 200)

                  snippet = content[start:end]
                  snippet = snippet.replace("\n", " ")

                  print(f"\nFILE: {path}")
                  print(f"POSITION: {match.start()}")
                  print(f"CODE: {snippet}")

                  matches += 1

                  if matches >= 40:
                      break

              if matches >= 40:
                  break

          print()
          print("TOTAL MATCHES SHOWN:", matches)
          PY

          echo ""
          echo "=== INSPECTION COMPLETE ==="

      - name: Create Diagnostics Page
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("public")

          wasm_files = list(root.rglob("*.wasm"))

          if not wasm_files:
              raise SystemExit("No WASM files found")

          wasm = max(
              wasm_files,
              key=lambda p: p.stat().st_size
          )

          wasm_path = "./" + wasm.relative_to(root).as_posix()

          html = """
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width,initial-scale=1">
            <title>WordCraft Diagnostics</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                padding: 20px;
                background: #f5f5f5;
              }
              button {
                padding: 12px;
                margin: 6px;
                font-size: 16px;
              }
              pre {
                background: white;
                padding: 15px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
              }
            </style>
          </head>
          <body>

          <h2>WordCraft Diagnostics</h2>

          <p>Проверка загрузки WebAssembly.</p>

          <button onclick="diagnose()">
            Проверить заголовки WASM
          </button>

          <pre id="output"></pre>

          <script>
          const WASM = __WASM_PATH__;

          function log(text) {
            document.getElementById("output")
              .textContent += text + "\\n";
          }

          async function diagnose() {
            document.getElementById("output")
              .textContent = "";

            log("WORDCRAFT DIAGNOSTICS");
            log("=====================");

            log("User Agent:");
            log(navigator.userAgent);

            log("");
            log("WASM: " + WASM);

            try {
              const response = await fetch(WASM, {
                method: "HEAD",
                cache: "no-store"
              });

              log("HTTP: " + response.status);

              for (const [key, value] of
                   response.headers.entries()) {
                log(key + ": " + value);
              }

            } catch (error) {
              log("ERROR: " + error);
            }
          }
          </script>

          </body>
          </html>
          """

          html = html.replace(
              "__WASM_PATH__",
              json.dumps(wasm_path)
          )

          (root / "diagnostics.html").write_text(
              html,
              encoding="utf-8"
          )

          print("Diagnostics page created")
          PY

      - name: Verify Deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking files..."

          test -f public/index.html
          test -f public/diagnostics.html

          find public -name "*.wasm" -print

          echo "All required files exist."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
