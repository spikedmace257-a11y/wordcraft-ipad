name: Deploy WordCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================
      # 1. DOWNLOAD WORDCRAFT
      # ==========================================

      - name: Download WordCraft
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip \
            -o wordcraft.zip

          unzip -q wordcraft.zip -d extracted

          SITE=$(find extracted -name index.html -print -quit)

          test -n "$SITE"

          SITE=$(dirname "$SITE")

          mkdir -p public

          cp -a "$SITE"/. public/

          touch public/.nojekyll

          echo "WordCraft downloaded successfully"


      # ==========================================
      # 2. VERIFY WORDCRAFT FILES
      # ==========================================

      - name: Verify WordCraft Files
        shell: bash
        run: |
          set -euo pipefail

          test -f public/index.html

          echo "=== FILES ==="
          find public -type f | head -80

          echo "=== WEBASSEMBLY ==="
          find public -type f -name "*.wasm"

          echo "=== JAVASCRIPT ==="
          find public -type f \
            \( -name "*.js" -o -name "*.mjs" \)

          echo "=== FILE SIZES ==="
          du -ah public | sort -h | tail -20


      # ==========================================
      # 3. INSTALL STARTUP DIAGNOSTICS
      # ==========================================

      - name: Install Safari Startup Diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("public/index.html")
          html = p.read_text(encoding="utf-8")

          script = r'''
          <script>
          (() => {

            let appStarted = false;
            let lastError = null;

            const startTime = performance.now();

            const standalone =
              window.matchMedia(
                "(display-mode: standalone)"
              ).matches ||
              navigator.standalone === true;

            function formatError(error) {

              if (error == null) {
                return "Неизвестная ошибка";
              }

              return error.stack ||
                     error.message ||
                     String(error);
            }

            function getEnvironment() {

              const wasm =
                typeof WebAssembly !== "undefined";

              const webgl2 =
                typeof WebGL2RenderingContext !== "undefined";

              const webgpu =
                typeof navigator.gpu !== "undefined";

              const initialized =
                typeof window.wasmBindings !== "undefined";

              const elapsed =
                Math.round(
                  (performance.now() - startTime) / 1000
                );

              return (
                "\n\n=== СОСТОЯНИЕ БРАУЗЕРА ===" +

                "\nРежим: " +
                (standalone ? "PWA" : "Safari") +

                "\nWebAssembly: " +
                (wasm ? "доступен" : "недоступен") +

                "\nWebGL2 API: " +
                (webgl2 ? "обнаружен" : "не обнаружен") +

                "\nWebGPU API: " +
                (webgpu ? "обнаружен" : "не обнаружен") +

                "\nWASM bindings: " +
                (initialized ? "созданы" : "не созданы") +

                "\nСигнал запуска: " +
                (appStarted ? "получен" : "не получен") +

                "\nВремя: " + elapsed + " секунд" +

                "\nАдрес: " +
                window.location.href +

                "\nUser Agent: " +
                navigator.userAgent
              );
            }

            function showError(message) {

              lastError = message;

              function display() {

                let box =
                  document.getElementById(
                    "wordcraft_diagnostics"
                  );

                if (!box) {

                  box = document.createElement("div");

                  box.id = "wordcraft_diagnostics";

                  document.body.appendChild(box);
                }

                box.style.cssText = `
                  position: fixed;
                  inset: 0;
                  z-index: 999999;
                  padding: 24px;
                  box-sizing: border-box;
                  background: #fff5f5;
                  color: #8b0000;
                  font: 14px system-ui, sans-serif;
                  white-space: pre-wrap;
                  overflow: auto;
                  overflow-wrap: anywhere;
                  text-align: left;
                  pointer-events: auto;
                `;

                box.textContent =
                  "ДИАГНОСТИКА WORDCRAFT\n\n" +
                  message +
                  getEnvironment();
              }

              if (document.body) {
                display();
              } else {
                document.addEventListener(
                  "DOMContentLoaded",
                  display,
                  { once: true }
                );
              }
            }

            window.addEventListener(
              "error",
              event => {

                if (event.target !== window) {

                  const target = event.target;

                  const resource =
                    target.src ||
                    target.href ||
                    target.tagName ||
                    "неизвестный ресурс";

                  showError(
                    "ОШИБКА ЗАГРУЗКИ РЕСУРСА\n\n" +
                    resource
                  );

                  return;
                }

                showError(
                  "ОШИБКА JAVASCRIPT\n\n" +
                  (event.message || "Неизвестная ошибка") +
                  "\n\n" +
                  formatError(event.error)
                );

              },
              true
            );

            window.addEventListener(
              "unhandledrejection",
              event => {

                showError(
                  "ОШИБКА ЗАПУСКА WORDCRAFT\n\n" +
                  formatError(event.reason)
                );

              }
            );

            window.addEventListener(
              "TrunkApplicationStarted",
              () => {

                appStarted = true;

                console.log(
                  "WordCraft startup signal received"
                );

              }
            );

            setTimeout(() => {

              if (lastError || appStarted) {
                return;
              }

              const loading =
                document.getElementById(
                  "wordcraft_loading"
                );

              if (!loading) {
                return;
              }

              const style =
                window.getComputedStyle(loading);

              if (
                style.display === "none" ||
                style.visibility === "hidden"
              ) {
                return;
              }

              showError(
                "WORDCRAFT НЕ ЗАПУСТИЛСЯ\n\n" +
                "Приложение не отправило сигнал " +
                "запуска за 45 секунд."
              );

            }, 45000);

          })();
          </script>
          '''

          if "<head>" not in html:
              raise SystemExit("HEAD not found")

          html = html.replace(
              "<head>",
              "<head>\n" + script,
              1
          )

          p.write_text(html, encoding="utf-8")

          print("Startup diagnostics installed")
          PY


      # ==========================================
      # 4. CREATE NETWORK DIAGNOSTICS
      # ==========================================

      - name: Create Network Diagnostics
        shell: bash
        run: |
          cat > public/diagnostics.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">

          <head>
          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1">

          <title>WordCraft Diagnostics</title>

          <style>

          body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #222;
          }

          h1 {
            font-size: 24px;
          }

          pre {
            background: white;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }

          button {
            padding: 12px 18px;
            font-size: 16px;
            margin-bottom: 20px;
          }

          </style>

          </head>

          <body>

          <h1>WordCraft Diagnostics</h1>

          <button onclick="runTests()">
            Запустить диагностику
          </button>

          <pre id="output">
          Нажмите кнопку для проверки.
          </pre>

          <script>

          const output =
            document.getElementById("output");

          function log(message) {

            output.textContent +=
              message + "\n";
          }

          async function runTests() {

            output.textContent = "";

            const standalone =
              window.matchMedia(
                "(display-mode: standalone)"
              ).matches ||
              navigator.standalone === true;

            log(
              "Режим: " +
              (standalone ? "PWA" : "Safari")
            );

            log(
              "WebAssembly: " +
              (typeof WebAssembly !== "undefined")
            );

            log(
              "WebGL2: " +
              (typeof WebGL2RenderingContext !== "undefined")
            );

            log(
              "WebGPU: " +
              (typeof navigator.gpu !== "undefined")
            );

            log("\n=== WASM TEST ===");

            try {

              const files = await fetch(
                "./wasm-file.txt",
                { cache: "no-store" }
              );

              if (!files.ok) {
                throw new Error(
                  "WASM filename request: HTTP " +
                  files.status
                );
              }

              const wasmFile =
                (await files.text()).trim();

              log("Файл: " + wasmFile);

              const response = await fetch(
                "./" + wasmFile,
                { cache: "no-store" }
              );

              log(
                "HTTP Status: " +
                response.status
              );

              log(
                "Content-Type: " +
                response.headers.get(
                  "content-type"
                )
              );

              if (!response.ok) {
                throw new Error(
                  "HTTP " + response.status
                );
              }

              const buffer =
                await response.arrayBuffer();

              log(
                "Размер: " +
                buffer.byteLength +
                " bytes"
              );

              log("Компиляция WASM...");

              await WebAssembly.compile(buffer);

              log("WASM compilation: SUCCESS");

            } catch (error) {

              log(
                "ERROR: " +
                (error.stack || error.message)
              );
            }

          }

          </script>

          </body>
          </html>
          EOF


      # ==========================================
      # 5. REGISTER WASM FILE
      # ==========================================

      - name: Register WASM File
        shell: bash
        run: |
          set -euo pipefail

          WASM=$(find public -type f \
            -name "*.wasm" -print -quit)

          test -n "$WASM"

          WASM=${WASM#public/}

          printf '%s\n' "$WASM" \
            > public/wasm-file.txt

          echo "WASM file: $WASM"


      # ==========================================
      # 6. CONFIGURE GITHUB PAGES
      # ==========================================

      - name: Configure Pages
        uses: actions/configure-pages@v5


      # ==========================================
      # 7. UPLOAD WEBSITE
      # ==========================================

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public


      # ==========================================
      # 8. DEPLOY WEBSITE
      # ==========================================

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
