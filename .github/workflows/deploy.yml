name: Deploy WordCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download WordCraft
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip \
            -o wordcraft.zip

          unzip -q wordcraft.zip -d extracted

          SITE=$(find extracted -name index.html -print -quit)

          test -n "$SITE"

          SITE=$(dirname "$SITE")

          mkdir -p public

          cp -a "$SITE"/. public/

          touch public/.nojekyll

          echo "WordCraft files downloaded successfully"

      - name: Verify WordCraft Files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FILES ==="
          find public -type f | head -80

          echo "=== WEBASSEMBLY ==="
          find public -type f -name "*.wasm"

          echo "=== FILE SIZES ==="
          du -ah public | sort -h | tail -20

          test -f public/index.html

          WASM=$(find public -type f -name "*_bg.wasm" -print -quit)

          test -n "$WASM"

          echo "WASM file: $WASM"

      - name: Create WASM Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          public = Path("public")

          wasm_files = list(public.glob("*_bg.wasm"))

          if not wasm_files:
              raise SystemExit("ERROR: WASM file not found")

          wasm_name = wasm_files[0].name

          print("Diagnostic WASM:", wasm_name)

          html = r'''<!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1">

          <title>WordCraft Diagnostics</title>

          <style>
          body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
          }

          h1 {
            font-size: 24px;
          }

          button {
            padding: 14px 20px;
            font-size: 16px;
            border: 0;
            border-radius: 8px;
            background: #405bd8;
            color: white;
            cursor: pointer;
          }

          button:disabled {
            opacity: 0.5;
          }

          pre {
            background: white;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
            line-height: 1.5;
          }
          </style>
          </head>

          <body>

          <h1>WordCraft Diagnostics</h1>

          <p>Проверка загрузки WebAssembly на iPad.</p>

          <button id="start" onclick="runTests()">
            Запустить диагностику
          </button>

          <pre id="log">Ожидание запуска...</pre>

          <script>

          const wasmFile = __WASM_FILE__;

          const logElement =
            document.getElementById("log");

          const startButton =
            document.getElementById("start");

          function log(message) {
            logElement.textContent += message + "\n";
          }

          function formatBytes(bytes) {
            return (
              (bytes / 1024 / 1024).toFixed(2) +
              " MB"
            );
          }

          function elapsed(start) {
            return (
              (performance.now() - start) / 1000
            ).toFixed(2);
          }

          async function testRange(start, end) {

            log("\n=== RANGE TEST ===");

            log("Байты: " + start + "-" + end);

            const started = performance.now();

            try {

              const response = await fetch(wasmFile, {
                headers: {
                  Range: `bytes=${start}-${end}`
                },
                cache: "no-store"
              });

              log("HTTP Status: " + response.status);

              log(
                "Content-Length: " +
                response.headers.get("content-length")
              );

              log(
                "Content-Range: " +
                response.headers.get("content-range")
              );

              if (response.status !== 206) {

                log(
                  "Сервер не подтвердил частичную загрузку."
                );

                if (response.body) {
                  await response.body.cancel();
                }

                return;
              }

              const buffer =
                await response.arrayBuffer();

              log(
                "Получено: " +
                formatBytes(buffer.byteLength)
              );

              log(
                "Время: " +
                elapsed(started) +
                " сек."
              );

              const expected = end - start + 1;

              if (buffer.byteLength === expected) {
                log("РЕЗУЛЬТАТ: OK");
              } else {
                log("РЕЗУЛЬТАТ: НЕПОЛНЫЕ ДАННЫЕ");
              }

            } catch (error) {

              log("РЕЗУЛЬТАТ: ОШИБКА");

              log(error.name || "Error");

              log(error.message || String(error));

            }
          }

          async function testFullDownload() {

            log("\n=== FULL DOWNLOAD TEST ===");

            const started = performance.now();

            try {

              const response = await fetch(wasmFile, {
                cache: "no-store"
              });

              log("HTTP Status: " + response.status);

              log(
                "Content-Length: " +
                response.headers.get("content-length")
              );

              log(
                "Content-Type: " +
                response.headers.get("content-type")
              );

              if (!response.ok) {
                throw new Error(
                  "HTTP " + response.status
                );
              }

              const buffer =
                await response.arrayBuffer();

              log(
                "Получено: " +
                formatBytes(buffer.byteLength)
              );

              log(
                "Время: " +
                elapsed(started) +
                " сек."
              );

              log("РЕЗУЛЬТАТ: ЗАГРУЗКА УСПЕШНА");

            } catch (error) {

              log("РЕЗУЛЬТАТ: ОШИБКА");

              log(error.name || "Error");

              log(error.message || String(error));

            }
          }

          async function runTests() {

            startButton.disabled = true;

            logElement.textContent = "";

            try {

              log("WORDCRAFT WASM DIAGNOSTICS");

              log("=========================");

              log("\nUser Agent:");

              log(navigator.userAgent);

              log(
                "\nWebAssembly: " +
                (typeof WebAssembly !== "undefined")
              );

              log(
                "WebGL2: " +
                (typeof WebGL2RenderingContext !==
                 "undefined")
              );

              log(
                "WebGPU: " +
                (typeof navigator.gpu !== "undefined")
              );

              log("\nWASM FILE:");

              log(wasmFile);

              log("\nПроверка первого мегабайта");

              await testRange(0, 1048575);

              log("\nПроверка второго мегабайта");

              await testRange(1048576, 2097151);

              log("\nПроверка блока 10–11 MB");

              await testRange(10485760, 11534335);

              log("\nПроверка полной загрузки");

              await testFullDownload();

              log("\n=== ДИАГНОСТИКА ЗАВЕРШЕНА ===");

            } catch (error) {

              log("\nНЕОЖИДАННАЯ ОШИБКА");

              log(String(error));

            } finally {

              startButton.disabled = false;

            }
          }

          </script>

          </body>
          </html>
          '''

          html = html.replace(
              "__WASM_FILE__",
              json.dumps(wasm_name)
          )

          (public / "diagnostics.html").write_text(
              html,
              encoding="utf-8"
          )

          print("Diagnostics created successfully")
          PY

      - name: Verify Deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== VERIFY DEPLOYMENT ==="

          test -f public/index.html

          test -f public/diagnostics.html

          WASM=$(find public -type f -name "*_bg.wasm" -print -quit)

          test -n "$WASM"

          echo "=== WASM SIZE ==="
          du -h "$WASM"

          echo "=== DIAGNOSTICS ==="
          ls -lh public/diagnostics.html

          echo "=== TOTAL SIZE ==="
          du -sh public

          echo "Verification successful"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
