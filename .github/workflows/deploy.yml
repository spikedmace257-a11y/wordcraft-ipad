name: Deploy WordCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download WordCraft
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip \
            -o wordcraft.zip

          unzip -q wordcraft.zip -d extracted

          SITE=$(find extracted -name index.html -print -quit)
          test -n "$SITE"

          SITE=$(dirname "$SITE")

          mkdir -p public
          cp -a "$SITE"/. public/

          touch public/.nojekyll

      - name: Create WASM Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("public")
          wasm_files = list(root.rglob("*.wasm"))

          if not wasm_files:
              raise SystemExit("WASM file not found")

          wasm = max(
              wasm_files,
              key=lambda p: p.stat().st_size
          )

          wasm_path = wasm.relative_to(root).as_posix()
          wasm_size = wasm.stat().st_size

          print("WASM:", wasm_path)
          print("Size:", wasm_size)

          html = r'''<!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1">

          <title>WordCraft WASM Diagnostics</title>

          <style>
          body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
          }

          h1 {
            font-size: 25px;
          }

          button {
            padding: 14px 20px;
            font-size: 16px;
            background: #405bd4;
            color: white;
            border: 0;
            border-radius: 8px;
            margin: 8px 8px 8px 0;
          }

          button:disabled {
            opacity: .5;
          }

          pre {
            background: white;
            padding: 18px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
            line-height: 1.5;
          }

          progress {
            width: 100%;
            height: 22px;
          }

          a {
            color: #405bd4;
          }
          </style>
          </head>

          <body>

          <h1>WordCraft WASM Diagnostics</h1>

          <p>
          Проверка загрузки WebAssembly на iPad.
          </p>

          <button id="start">
          Запустить диагностику
          </button>

          <button id="copy">
          Скопировать отчёт
          </button>

          <p>
          <progress id="progress"
                    value="0"
                    max="100"></progress>
          </p>

          <p id="status">Ожидание запуска</p>

          <pre id="log"></pre>

          <p>
          <a href="./">Открыть WordCraft</a>
          </p>

          <script>
          const WASM_FILE = __WASM_PATH__;
          const EXPECTED_SIZE = __WASM_SIZE__;

          const CHUNK_SIZE = 1024 * 1024;
          const MAX_RETRIES = 5;
          const REQUEST_TIMEOUT = 45000;

          const logElement =
            document.getElementById("log");

          const progress =
            document.getElementById("progress");

          const status =
            document.getElementById("status");

          const startButton =
            document.getElementById("start");

          let running = false;

          function log(message) {
            logElement.textContent +=
              message + "\n";

            console.log(message);
          }

          function sleep(ms) {
            return new Promise(resolve =>
              setTimeout(resolve, ms)
            );
          }

          function formatError(error) {
            return error?.stack ||
                   error?.message ||
                   String(error);
          }

          async function fetchChunk(start, end) {

            for (
              let attempt = 1;
              attempt <= MAX_RETRIES;
              attempt++
            ) {

              const controller =
                new AbortController();

              const timer = setTimeout(
                () => controller.abort(),
                REQUEST_TIMEOUT
              );

              try {

                const response = await fetch(
                  WASM_FILE,
                  {
                    cache: "no-store",
                    headers: {
                      Range:
                        `bytes=${start}-${end}`
                    },
                    signal: controller.signal
                  }
                );

                if (response.status !== 206) {
                  throw new Error(
                    "Expected HTTP 206, got " +
                    response.status
                  );
                }

                const range =
                  response.headers.get(
                    "Content-Range"
                  );

                const encoding =
                  response.headers.get(
                    "Content-Encoding"
                  );

                const expectedRange =
                  `bytes ${start}-${end}/${EXPECTED_SIZE}`;

                if (range !== expectedRange) {
                  throw new Error(
                    "Unexpected Content-Range: " +
                    range
                  );
                }

                const buffer =
                  await response.arrayBuffer();

                const expectedLength =
                  end - start + 1;

                if (
                  buffer.byteLength !==
                  expectedLength
                ) {
                  throw new Error(
                    "Invalid chunk size: " +
                    buffer.byteLength
                  );
                }

                if (encoding) {
                  log(
                    "Content-Encoding: " +
                    encoding
                  );
                }

                return new Uint8Array(buffer);

              } catch (error) {

                log(
                  `Ошибка блока ${start}-${end}, ` +
                  `попытка ${attempt}: ` +
                  formatError(error)
                );

                if (attempt === MAX_RETRIES) {
                  throw error;
                }

                await sleep(
                  Math.min(
                    15000,
                    1500 * attempt
                  )
                );

              } finally {
                clearTimeout(timer);
              }
            }
          }

          async function diagnose() {

            if (running) return;

            running = true;
            startButton.disabled = true;

            logElement.textContent = "";
            progress.value = 0;

            try {

              log("WORDCRAFT WASM DIAGNOSTICS");
              log("==========================");

              log("User Agent:");
              log(navigator.userAgent);

              log("");
              log(
                "WebAssembly: " +
                (typeof WebAssembly !==
                 "undefined")
              );

              log("WASM: " + WASM_FILE);
              log(
                "Expected size: " +
                EXPECTED_SIZE
              );

              log("");
              log("=== HEADER TEST ===");

              const headerResponse =
                await fetch(WASM_FILE, {
                  method: "HEAD",
                  cache: "no-store"
                });

              log(
                "HTTP Status: " +
                headerResponse.status
              );

              log(
                "Content-Length: " +
                headerResponse.headers.get(
                  "Content-Length"
                )
              );

              log(
                "Content-Encoding: " +
                headerResponse.headers.get(
                  "Content-Encoding"
                )
              );

              log(
                "Content-Type: " +
                headerResponse.headers.get(
                  "Content-Type"
                )
              );

              log("");
              log("=== CHUNK DOWNLOAD ===");

              const chunks = [];

              let downloaded = 0;

              const started = performance.now();

              for (
                let offset = 0;
                offset < EXPECTED_SIZE;
                offset += CHUNK_SIZE
              ) {

                const end = Math.min(
                  offset + CHUNK_SIZE - 1,
                  EXPECTED_SIZE - 1
                );

                status.textContent =
                  "Загрузка: " +
                  Math.floor(
                    downloaded /
                    EXPECTED_SIZE * 100
                  ) + "%";

                const chunk =
                  await fetchChunk(offset, end);

                chunks.push(chunk);

                downloaded += chunk.byteLength;

                progress.value =
                  downloaded /
                  EXPECTED_SIZE * 100;

                log(
                  "OK: " +
                  offset + "-" + end +
                  " (" +
                  downloaded +
                  "/" +
                  EXPECTED_SIZE +
                  ")"
                );

              }

              const elapsed =
                (performance.now() - started)
                / 1000;

              log("");
              log("=== DOWNLOAD RESULT ===");

              log(
                "Downloaded: " +
                downloaded
              );

              log(
                "Time: " +
                elapsed.toFixed(2) +
                " seconds"
              );

              if (
                downloaded !== EXPECTED_SIZE
              ) {
                throw new Error(
                  "Downloaded size mismatch"
                );
              }

              status.textContent =
                "Сборка WebAssembly";

              const wasmBytes =
                new Uint8Array(EXPECTED_SIZE);

              let position = 0;

              for (const chunk of chunks) {

                wasmBytes.set(
                  chunk,
                  position
                );

                position += chunk.byteLength;

              }

              log("");
              log("=== WASM VALIDATION ===");

              const magic =
                Array.from(
                  wasmBytes.slice(0, 8)
                ).map(
                  x => x.toString(16)
                        .padStart(2, "0")
                ).join(" ");

              log("Header: " + magic);

              const validMagic =
                wasmBytes[0] === 0 &&
                wasmBytes[1] === 97 &&
                wasmBytes[2] === 115 &&
                wasmBytes[3] === 109;

              log(
                "WASM magic valid: " +
                validMagic
              );

              if (!validMagic) {
                throw new Error(
                  "Invalid WebAssembly header"
                );
              }

              log("");
              log("=== COMPILE TEST ===");

              status.textContent =
                "Компиляция WebAssembly";

              const module =
                await WebAssembly.compile(
                  wasmBytes
                );

              log(
                "Compilation: SUCCESS"
              );

              log(
                "Imports: " +
                WebAssembly.Module
                  .imports(module).length
              );

              log(
                "Exports: " +
                WebAssembly.Module
                  .exports(module).length
              );

              log("");
              log("DIAGNOSTICS COMPLETED");

              status.textContent =
                "Проверка завершена успешно";

            } catch (error) {

              log("");
              log("=== ERROR ===");
              log(formatError(error));

              status.textContent =
                "Диагностика завершилась ошибкой";

            } finally {

              running = false;
              startButton.disabled = false;

            }
          }

          document.getElementById(
            "start"
          ).addEventListener(
            "click",
            diagnose
          );

          document.getElementById(
            "copy"
          ).addEventListener(
            "click",
            async () => {

              const report =
                logElement.textContent;

              try {
                await navigator.clipboard
                  .writeText(report);

                alert("Отчёт скопирован");
              } catch (error) {
                alert(
                  "Не удалось скопировать отчёт"
                );
              }

            }
          );
          </script>

          </body>
          </html>
          '''

          html = html.replace(
              "__WASM_PATH__",
              json.dumps("./" + wasm_path)
          )

          html = html.replace(
              "__WASM_SIZE__",
              str(wasm_size)
          )

          (root / "diagnostics.html").write_text(
              html,
              encoding="utf-8"
          )

          print("Diagnostics created")

          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
